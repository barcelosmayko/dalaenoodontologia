<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dalaeno Odontologia{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="App">
        <header>
            <nav>
                <ul>
                    <li><a href="{{ url_for('index') }}">Início</a></li>
                    <li><a href="{{ url_for("servicos") }}">Serviços</a></li>
                  <li><a href="{{ url_for("sobre") }}">Sobre Nós</a></li>
                    <li><a href="{{ url_for("contato") }}">Contato</a></li>                   {# Add links for login/booking later #}
                </ul>
            </nav>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
        <footer>
            <p>&copy; {{ current_year }} Dalaeno Odontologia. Todos os direitos reservados.</p>
        </footer>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
